## IDF Component Manager Manifest File
dependencies:
  espressif/esp_hosted:
    version: 3.0.5
    rules:
    - if: target == esp32p4
  espressif/esp_wifi_remote:
    version: 1.5.3
    rules:
    - if: target == esp32p4
  espressif/dhara: ^1.0.0
  espressif/spi_nand_flash: ^1.3.0
  espressif/spi_nand_flash_fatfs: ^1.0.0
  espressif/esp_lcd_touch: ^1.2.1
  espressif/esp_lcd_touch_cst816s: ^1.1.1
  espressif/esp_lcd_touch_gt911: ^1.2.0
  waveshare/esp_lcd_touch_cst9217: ^1.0.4
  atanisoft/esp_lcd_touch_xpt2046: ^1.0.6
  espressif/esp_lcd_axs15231b: ^2.1.0
  espressif/esp_lcd_st7701:
    version: ^2.0.2
    rules:
    - if: target == esp32p4
  espressif/esp_lcd_jd9165:
    version: ^2.0.2
    rules:
    - if: target == esp32p4
  ## Required IDF version
  idf:
    version: '>=6.0.2'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true

